server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: send unknown paths (e.g. /notes, /profile) to index.html
    # so React Router can handle them on refresh or direct visits.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets never change — cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Always revalidate index.html so new deployments are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
